<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>kyle's portfolio</title>
<link rel="icon" type="image/png" href="bmoicon2.png">
<link href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box;}

  :root{
    --bmo-green: #5bcb9a;
    --bmo-green-dark: #3da87a;
    --bmo-green-darker: #2d8a62;
    --bmo-teal: #1a6b52;
    --bmo-screen: #0a2e3d;
    --bmo-screen-glow: #0d3a4d;
    --bmo-blue: #4ac8e8;
    --bmo-blue-dim: #2a8aaa;
    --bmo-yellow: #f5d63d;
    --bmo-yellow-dim: #c4a82e;
    --bmo-red: #e85454;
    --bmo-red-btn: #d94040;
    --bmo-dark: #0c1f18;
    --bmo-face-bg: #0b2a38;
    --bmo-white: #e8f5e9;
    --bmo-gray: #2a4a3a;
    --bmo-gray-light: #5a8a6a;
    --px: 8px;
    /* BMO's screen is a rounded aperture and his bezel overlaps the corners,
       so the desktop keeps everything out of them. The site still fills the
       glass edge to edge — only the content is held in. */
    --screen-safe: 30px;
    /* The titlebar and address bar of a maximised window sit deepest into the
       rounded corners, so they get a bigger inset than the desktop furniture.
       One value for both rows keeps their left edges aligned. */
    --chrome-safe: 58px;
  }

  .maximized {
  /* Genuinely full-bleed, right out to the glass. */
  top: 0 !important;
  left: 0 !important;
  width: 100vw !important;
  height: calc(100vh - 36px) !important;
  z-index: 99 !important;
  border-radius: 0 !important;
}

  /* A maximised window runs edge to edge, so its chrome rows are the ones that
     land in the rounded corners — the window itself stays full-bleed and only
     its CONTENTS are pulled in. Written against .maximized rather than a
     specific window, so the terminal gets it the moment it's maximised too. */
  .maximized > .titlebar,
  .maximized > .address-bar{
    padding-left: var(--chrome-safe);
    padding-right: var(--chrome-safe);
  }


  body{
    background: var(--bmo-green);
    width:100vw;height:100vh;overflow:hidden;
    font-family:'Silkscreen',monospace;
    color:var(--bmo-white);
    position:relative;
    background-image:
      linear-gradient(rgba(74,158,131,0.13) 1px, transparent 1px),
      linear-gradient(90deg, rgba(74,158,131,0.13) 1px, transparent 1px);
    background-size:32px 32px;
  }

.bmo-screen-frame {
  position: fixed;
  /* Fills the viewport so the desktop matches BMO's screen pane at whatever
     aspect the iframe is given. Was a fixed 800x650, which left the face as a
     centred island inside the wider (1.53 aspect) screen. */
  inset: 0;
  width: 100%;
  height: 100%;

  overflow: hidden;
  z-index: -1;
  background: #bad9c7;
  display: flex;
  align-items: center;
  justify-content: center;
  opacity: 1;
}

#bmoFaceSvg {
  display: block;
  width: 100%;
  height: 100%;
}

body {
  background: #bad9c7;
  width: 100vw;
  height: 100vh;
  overflow: hidden;
  font-family: 'Silkscreen', monospace;
  color: var(--bmo-white);
  position: relative;
  
}





  .icons{
    position:absolute;top:var(--screen-safe);left:var(--screen-safe);
    display:flex;flex-direction:column;gap:10px;z-index:2;
  }
  .icon{
    display:flex;flex-direction:column;align-items:center;gap:3px;
    cursor:pointer;transition:transform 0.1s;
  }
  .icon:hover .icon-shape{filter:brightness(1.2);}
  .icon:active{transform:scale(0.9);}
  .icon-shape{
    width:34px;height:34px;
    transition:filter 0.15s;
  }
  /* pixelarticons folder, tinted by the inline color on .icon-shape. */
  .icon-shape svg{width:100%;height:100%;display:block;}
  .icon span{
    font-size:6px;letter-spacing:1px;text-transform:uppercase;
    color:var(--bmo-dark);text-shadow:0 1px 0 rgba(255,255,255,0.3);
  }

  /* === Center file icon === */
  .center-icon{
    position:absolute;top:50%;left:50%;
    transform:translate(-50%,-50%);
    display:flex;flex-direction:column;align-items:center;gap:5px;
    cursor:pointer;z-index:3;transition:transform 0.1s;
  }
  .center-icon:hover .file-icon{filter:brightness(1.2);}
  .center-icon:active{transform:translate(-50%,-50%) scale(0.9);}
  .file-icon{
    width:48px;height:56px;position:relative;transition:filter 0.15s;
  }
  .file-icon .file-body{
    position:absolute;top:8px;left:0;width:100%;height:48px;
    background:var(--bmo-white);border-radius:3px;
    border:2px solid var(--bmo-teal);
  }
  .file-icon .file-fold{
    position:absolute;top:0;right:0;width:16px;height:16px;
    background:var(--bmo-green-dark);
    clip-path:polygon(0 0,100% 100%,0 100%);
    border-radius:0 0 0 2px;
  }
  .file-icon .file-corner{
    position:absolute;top:0;right:0;width:16px;height:16px;
    background:var(--bmo-white);border:2px solid var(--bmo-teal);
    border-radius:0 3px 0 0;
    clip-path:polygon(0 0,100% 0,100% 100%);
  }
  .file-icon .file-lines{
    position:absolute;top:18px;left:8px;right:8px;
    display:flex;flex-direction:column;gap:4px;
  }
  .file-icon .file-line{
    height:2px;background:var(--bmo-teal);border-radius:1px;opacity:0.4;
  }
  .file-icon .file-line:nth-child(2){width:75%;}
  .file-icon .file-line:nth-child(3){width:60%;}
  .center-icon .file-label{
    font-size:8px;letter-spacing:1px;
    color:var(--bmo-dark);text-shadow:0 1px 0 rgba(255,255,255,0.3);
    font-family:'Silkscreen',monospace;
  }

  /* === Windows === */
  .window{
    position:absolute;
    border:2px solid var(--bmo-teal);
    border-radius:6px;
    background:var(--bmo-screen);
    box-shadow:
      4px 4px 0 rgba(12,31,24,0.5),
      inset 0 0 30px rgba(74,200,232,0.03);
    z-index:5;
    display:flex;flex-direction:column;
    overflow:hidden;
    transition: top 0.32s cubic-bezier(.4,0,.2,1),
                left 0.32s cubic-bezier(.4,0,.2,1),
                width 0.32s cubic-bezier(.4,0,.2,1),
                height 0.32s cubic-bezier(.4,0,.2,1),
                border-radius 0.32s cubic-bezier(.4,0,.2,1);
  }
  .titlebar{
    display:flex;align-items:center;justify-content:space-between;
    padding:5px 8px;
    font-family:'Silkscreen',monospace;font-size:12px;
    flex-shrink:0;cursor:default;
    border-bottom:2px solid var(--bmo-teal);
  }
  .titlebar-buttons{display:flex;gap:5px;}
  .titlebar-buttons span{
    width:16px;height:16px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    cursor:pointer;transition:transform 0.1s;
  }
  /* The glyph takes the button's own text colour, so each one is already
     tuned for contrast against its fill: dark on yellow and green, white on
     red. crispEdges keeps the 2px grid sharp at this size. */
  .titlebar-buttons span svg{width:10px;height:10px;display:block;}
  .titlebar-buttons span:active{transform:scale(0.85);}
  .btn-close{background:var(--bmo-red-btn);color:var(--bmo-dark);}
  .btn-min{background:var(--bmo-yellow);color:var(--bmo-dark);}
  .btn-max{background:var(--bmo-green-dark);color:var(--bmo-dark);}

  .window-body{flex:1;overflow:hidden;padding:8px;}

  /* Inline pixelarticons. fill=currentColor, so they take the colour of
     whatever they sit in; crispEdges keeps the 2px grid from anti-aliasing
     into mush at small sizes. */
  .pxi{
    display:inline-block;
    vertical-align:-0.18em;
    flex-shrink:0;
  }

  /* === Window dragging === */
  /* The titlebar is the drag handle; its buttons keep their own cursor. */
  .titlebar{cursor:move;user-select:none;}
  .titlebar-buttons span{cursor:pointer;}

  /* The rubber band. Only this moves while you drag — the window jumps to it
     on release. Drawn with repeating gradients rather than `border:dashed`
     so it reads as the old 50% stipple marquee instead of a modern dashed
     rule: 2px on, 2px off, on all four edges. */
  .drag-ghost{
    position:absolute;
    display:none;
    z-index:98;
    pointer-events:none;
    background:
      repeating-linear-gradient(to right,  var(--bmo-white) 0 2px, transparent 2px 4px) left  top    /100% 2px no-repeat,
      repeating-linear-gradient(to right,  var(--bmo-white) 0 2px, transparent 2px 4px) left  bottom /100% 2px no-repeat,
      repeating-linear-gradient(to bottom, var(--bmo-white) 0 2px, transparent 2px 4px) left  top    /2px 100% no-repeat,
      repeating-linear-gradient(to bottom, var(--bmo-white) 0 2px, transparent 2px 4px) right top    /2px 100% no-repeat;
    opacity:0.9;
  }

  /* .window animates top/left for the maximise tween. A drag has to land in
     one frame, so that transition is suppressed for the drop. */
  .window.no-anim{transition:none !important;}

  /* Terminal */
  .win-terminal{
    top:40px;left:100px;width:380px;height:320px;
  }
  .win-terminal .titlebar{
    background:var(--bmo-teal);color:var(--bmo-yellow);
  }
  .terminal-lines{
    font-family:'Silkscreen',monospace;font-size:10px;line-height:1.85;white-space:pre;
  }
  .t-blue{color:var(--bmo-blue);}
  .t-blue-dim{color:var(--bmo-blue-dim);}
  .t-green{color:var(--bmo-green);}
  .t-green-dim{color:var(--bmo-green-dark);}
  .t-yellow{color:var(--bmo-yellow);}
  .t-yellow-dim{color:var(--bmo-yellow-dim);}
  .t-white{color:var(--bmo-white);}
  .t-gray{color:var(--bmo-gray-light);}
  .t-red{color:var(--bmo-red);}
  .cursor-blink{animation:blink 0.8s step-end infinite;}
  @keyframes blink{0%,100%{opacity:1}50%{opacity:0}}

  /* === Browser Window === */
  .win-browser{
    top:60px;left:260px;width:620px;height:480px;
    display:flex;
  }
  .win-browser .titlebar{
    background:var(--bmo-green-darker);color:var(--bmo-white);
  }
  .address-bar{
    display:flex;align-items:center;gap:6px;
    padding:5px 8px;
    background:var(--bmo-dark);
    border-bottom:1px solid var(--bmo-teal);
    flex-shrink:0;
  }
  .address-bar .nav-btns{
    display:flex;gap:4px;
  }
  .address-bar .nav-btn{
    width:18px;height:18px;
    background:var(--bmo-gray);
    border:1px solid var(--bmo-teal);
    border-radius:3px;
    color:var(--bmo-gray-light);
    font-size:10px;
    display:flex;align-items:center;justify-content:center;
    cursor:default;
    font-family:'Silkscreen',monospace;
  }
  .address-bar .url-box{
    flex:1;
    background:var(--bmo-screen);
    border:1px solid var(--bmo-teal);
    border-radius:3px;
    padding:3px 8px;
    font-family:'Silkscreen',monospace;
    font-size:10px;
    color:var(--bmo-white);
    display:flex;align-items:center;gap:4px;
  }
  .address-bar .url-box .lock{
    color:var(--bmo-green);font-size:8px;
  }
  .address-bar .url-box .url-text{
    color:var(--bmo-gray-light);
  }
  .address-bar .url-box .url-text b{
    color:var(--bmo-white);font-weight:normal;
  }
  .browser-content{
    flex:1;overflow:hidden;
    background:#0d1a14;
    position:relative;
  }
  .browser-iframe{
    width:100%;height:100%;border:none;
    display:none;
  }
  .browser-loading{
    position:absolute;inset:0;
    display:flex;align-items:center;justify-content:center;
    text-align:center;
    font-family:'Silkscreen',monospace;
    color:var(--bmo-green);
  }
  .browser-loading .spinner{
    display:inline-block;
    width:24px;height:24px;
    border:3px solid var(--bmo-teal);
    border-top-color:var(--bmo-green);
    border-radius:50%;
    animation:spin 0.8s linear infinite;
    margin-bottom:8px;
  }
  @keyframes spin{to{transform:rotate(360deg)}}
  .win-hidden{display:none!important;}
  .task-hidden{display:none!important;}

  /* === Taskbar === */
  .taskbar{
    position:absolute;bottom:0;left:0;right:0;height:36px;
    background:var(--bmo-green-dark);
    border-top:2px solid var(--bmo-teal);
    display:flex;align-items:center;padding:0 var(--screen-safe);gap:6px;z-index:10;
  }
  .start-btn{
    background:var(--bmo-yellow);color:var(--bmo-dark);
    border:2px solid var(--bmo-yellow-dim);
    padding:3px 12px;font-family:'Silkscreen',monospace;
    font-size:9px;cursor:pointer;border-radius:3px;
    letter-spacing:1px;transition:all 0.1s;
  }
  .start-btn:active{transform:scale(0.95);filter:brightness(0.85);}
  .task-item{
    background:var(--bmo-teal);border:1px solid var(--bmo-green-darker);
    padding:3px 10px;font-size:7px;border-radius:2px;
    color:var(--bmo-white);cursor:pointer;
  }
  /* === Mini-player === */
  .mini-player{
    position:absolute;bottom:46px;right:var(--screen-safe);
    background:var(--bmo-screen);
    border:2px solid var(--bmo-teal);
    border-radius:4px;
    padding:6px 10px;
    display:flex;align-items:center;gap:8px;
    z-index:9;font-family:'Silkscreen',monospace;
    box-shadow:0 0 8px rgba(0,0,0,0.4);
  }
  .mini-player-note{
    font-size:11px;color:var(--bmo-green-dark);
    animation:noteFloat 1.2s ease-in-out infinite alternate;
  }
  @keyframes noteFloat{from{opacity:0.5;transform:translateY(0)}to{opacity:1;transform:translateY(-2px)}}
  .mini-player-label{font-size:7px;color:var(--bmo-gray-light);letter-spacing:1px;margin-bottom:1px;}
  .mini-player-title{font-size:8px;color:var(--bmo-white);letter-spacing:0.5px;white-space:nowrap;}
  .mini-player-btn{
    background:none;border:1px solid var(--bmo-teal);border-radius:2px;
    color:var(--bmo-green-dark);font-size:9px;cursor:pointer;padding:1px 5px;
    font-family:'Silkscreen',monospace;transition:background 0.1s;
  }
  .mini-player-btn:hover{background:var(--bmo-teal);}

  .clock{
    margin-left:auto;font-family:'Silkscreen',monospace;
    font-size:10px;color:var(--bmo-yellow);
  }

  .version{
    position:absolute;bottom:42px;right:var(--screen-safe);
    font-family:'Silkscreen',monospace;font-size:7px;
    color:var(--bmo-green-darker);z-index:1;
  }

  .pixel-football{
    position:absolute;bottom:52px;left:var(--screen-safe);z-index:1;
    font-family:'Silkscreen',monospace;font-size:9px;
    color:var(--bmo-teal);text-align:center;
    cursor:pointer;
  }
  .pixel-football canvas{
    image-rendering:pixelated;display:block;margin:0 auto 2px;
    transition:transform 0.1s;
  }
  .pixel-football:hover canvas{ transform:scale(1.1); }
  .pixel-football:active canvas{ transform:scale(0.9); }

  /* === Screen-on / eye-adjust intro =====================================
     Fires once on page load. Two effects layered:
       1. A pure-white overlay (#screenFlash) that starts opaque and fades
          out — this is the "you just got blinded by the monitor" pop.
       2. A brightness + blur filter applied to the whole body that decays
          to normal — this is your eyes refocusing and the gain settling.
     ==================================================================== */
  #screenFlash{
    position:fixed; inset:0;
    background:#ffffff;
    z-index:99999;
    pointer-events:none;
    opacity:1;
    will-change:opacity, filter;
    /* Soft inner glow so the edges of the flash feel volumetric, not flat */
    box-shadow: inset 0 0 240px 80px #ffffff;
    animation: screenFlashFade 1.6s cubic-bezier(.2,.7,.2,1) forwards;
  }
  @keyframes screenFlashFade{
    0%   { opacity:1;    background:#ffffff; }
    8%   { opacity:0.98; background:#f4ffff; }     /* slight cool tint as it cools off */
    25%  { opacity:0.7;  background:#dcefe4; }
    55%  { opacity:0.28; background:#cde6d8; }
    85%  { opacity:0.06; background:#bad9c7; }
    100% { opacity:0;    background:#bad9c7; }
  }


  /* Respect users who prefer reduced motion — skip the intro entirely. */
  @media (prefers-reduced-motion: reduce){
    #screenFlash{ animation:none; opacity:0; }
  }
</style>
</head>
<body>

<!-- Eye-adjustment flash. CSS handles the fade; we just remove the node
     after the animation so it can't ever block clicks or burn the GPU. -->
<div id="screenFlash" aria-hidden="true"></div>

<div class="bmo-screen-frame" id="bmoFaceFrame">
  <svg id="bmoFaceSvg" viewBox="0 0 800 650" xmlns="http://www.w3.org/2000/svg">
    <!-- Left eye: group lets us translate for mouse tracking independently of ry for blinking -->
    <g id="leftEyeGroup">
      <ellipse id="leftEllipse" cx="160" cy="235" rx="18" ry="30" fill="#1a1a1a"/>
    </g>
    <!-- Right eye -->
    <g id="rightEyeGroup">
      <ellipse id="rightEllipse" cx="640" cy="235" rx="18" ry="30" fill="#1a1a1a"/>
    </g>
    <!-- Smile -->
    <g id="smileGroup">
      <path d="M 238 345 Q 400 438 562 345" stroke="#1a1a1a" stroke-width="6" fill="none" stroke-linecap="round"/>
    </g>
  </svg>
</div>

<div class="bmo-face-bg"></div>
<div class="sparkles" id="sparkles"></div>

<!-- Desktop Icons -->
<div class="icons">
  <div class="icon">
    <div class="icon-shape" style="color:var(--bmo-blue)"><svg viewBox="0 0 24 24" fill="currentColor" shape-rendering="crispEdges" aria-hidden="true"><path d="M4 4h6v2H4zm0 14h16v2H4zM20 8h2v10h-2zM2 6h2v12H2zm8 0h10v2H10z"/></svg></div>
    <span>games</span>
  </div>
  <div class="icon">
    <div class="icon-shape" style="color:var(--bmo-yellow)"><svg viewBox="0 0 24 24" fill="currentColor" shape-rendering="crispEdges" aria-hidden="true"><path d="M4 4h6v2H4zm0 14h16v2H4zM20 8h2v10h-2zM2 6h2v12H2zm8 0h10v2H10z"/></svg></div>
    <span>photos</span>
  </div>
  <div class="icon">
    <div class="icon-shape" style="color:var(--bmo-red)"><svg viewBox="0 0 24 24" fill="currentColor" shape-rendering="crispEdges" aria-hidden="true"><path d="M4 4h6v2H4zm0 14h16v2H4zM20 8h2v10h-2zM2 6h2v12H2zm8 0h10v2H10z"/></svg></div>
    <span>music</span>
  </div>
  <div class="icon">
    <div class="icon-shape" style="color:var(--bmo-green-dark)"><svg viewBox="0 0 24 24" fill="currentColor" shape-rendering="crispEdges" aria-hidden="true"><path d="M4 4h6v2H4zm0 14h16v2H4zM20 8h2v10h-2zM2 6h2v12H2zm8 0h10v2H10z"/></svg></div>
    <span>camera</span>
  </div>
  <div class="icon">
    <div class="icon-shape" style="color:var(--bmo-white)"><svg viewBox="0 0 24 24" fill="currentColor" shape-rendering="crispEdges" aria-hidden="true"><path d="M4 4h6v2H4zm0 14h16v2H4zM20 8h2v10h-2zM2 6h2v12H2zm8 0h10v2H10z"/></svg></div>
    <span>secrets</span>
  </div>
</div>

<!-- Center Portfolio File Icon -->
<div class="center-icon" id="portfolioIcon">
  <div class="file-icon">
    <div class="file-body"></div>
    <div class="file-corner"></div>
    <div class="file-lines">
      <div class="file-line"></div>
      <div class="file-line"></div>
      <div class="file-line"></div>
    </div>
  </div>
  <span class="file-label">portfolio</span>
</div>

<!-- Terminal Window -->
<div class="window win-terminal" id="terminalWindow">
  <div class="titlebar">
    BMO TERMINAL
    <div class="titlebar-buttons">
      <span class="btn-min" onclick="toggleWindow('terminal')"><svg viewBox="0 0 24 24" fill="currentColor" shape-rendering="crispEdges" aria-hidden="true"><path d="M4 11h16v2H4z"/></svg></span>
      <span class="btn-max" onclick="maximizeWindow('terminal')"><svg viewBox="0 0 24 24" fill="currentColor" shape-rendering="crispEdges" aria-hidden="true"><path d="M2 4h2v16H2zm2 16h16v2H4zM20 4h2v16h-2zM4 2h16v2H4z"/></svg></span>
    
      <span class="btn-close" onclick="closeWindow('terminal')"><svg viewBox="0 0 24 24" fill="currentColor" shape-rendering="crispEdges" aria-hidden="true"><path d="M7 19H5V17H7V19ZM19 19H17V17H19V19ZM9 15V17H7V15H9ZM17 17H15V15H17V17ZM11 15H9V13H11V15ZM15 15H13V13H15V15ZM13 13H11V11H13V13ZM11 11H9V9H11V11ZM15 11H13V9H15V11ZM9 9H7V7H9V9ZM17 9H15V7H17V9ZM7 7H5V5H7V7ZM19 7H17V5H19V7Z"/></svg></span>  
    </div>
  </div>
  <div class="window-body" style="overflow-y:auto;">
    <div class="terminal-lines" id="terminal"></div>
  </div>
</div>

<!-- Browser Window -->
<div class="window win-browser win-hidden" id="browserWindow">
  <div class="titlebar">
    BMO BROWSER
    <div class="titlebar-buttons">

// ── BMO eye tracking + blinking ───────────────────────────────────────────────
(function initFace(){
  const leftGroup  = document.getElementById('leftEyeGroup');
  const rightGroup = document.getElementById('rightEyeGroup');
  const smileGroup = document.getElementById('smileGroup');
  const leftEl     = document.getElementById('leftEllipse');
  const rightEl    = document.getElementById('rightEllipse');

  // SVG logical eye centres (matching the viewBox)
  const LEFT_CX  = 160, LEFT_CY  = 235;
  const RIGHT_CX = 640, RIGHT_CY = 235;
  const NORMAL_RY = 30;

  // Smooth-follow state
  let targetDx = 0, targetDy = 0;
  let curDx    = 0, curDy    = 0;

  // Blink state
  let blinking = false;

  // ── Mouse tracking ──────────────────────────────────────────────────────────
  document.addEventListener('mousemove', function(e){
    const cx = window.innerWidth  / 2;
    const cy = window.innerHeight / 2;
    const nx = (e.clientX - cx) / cx;   // -1 … 1
    const ny = (e.clientY - cy) / cy;
    // Subtle: max ±16 px horizontal, ±11 px vertical
    targetDx = nx * 16;
    targetDy = ny * 11;
  });

  // ── Animation loop (smooth lerp) ────────────────────────────────────────────
  function tick(){
    curDx += (targetDx - curDx) * 0.07;
    curDy += (targetDy - curDy) * 0.07;

    // Apply translate to each eye group so blinking (ry change) stays centred
    leftGroup.setAttribute('transform',
      `translate(${LEFT_CX + curDx}, ${LEFT_CY + curDy})`);
    rightGroup.setAttribute('transform',
      `translate(${RIGHT_CX + curDx}, ${RIGHT_CY + curDy})`);

    // Smile follows at half the displacement for a subtler effect
    smileGroup.setAttribute('transform',
      `translate(${curDx * 0.5}, ${curDy * 0.5})`);

    // Pivot the ellipse around its own centre (group already positions it)
    leftEl.setAttribute('cx',  0); leftEl.setAttribute('cy',  0);
    rightEl.setAttribute('cx', 0); rightEl.setAttribute('cy', 0);

    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);

  // ── Blinking ────────────────────────────────────────────────────────────────
  function animateRy(fromRy, toRy, durationMs, onDone){
    const start = performance.now();
    function step(now){
      const t = Math.min((now - start) / durationMs, 1);
      const ry = fromRy + (toRy - fromRy) * t;
      leftEl.setAttribute('ry',  ry);
      rightEl.setAttribute('ry', ry);
      if (t < 1) requestAnimationFrame(step);
      else if (onDone) onDone();
    }
    requestAnimationFrame(step);
  }

  function doBlink(){
    if (blinking) return;
    blinking = true;

    animateRy(NORMAL_RY, 3, 75, () => {          // close
      setTimeout(() => {
        animateRy(3, NORMAL_RY, 110, () => {      // open
          blinking = false;
          scheduleNextBlink();
        });
      }, 55);                                      // hold closed
    });
  }

  function scheduleNextBlink(){
    // Blink every 2.5 – 5.5 s; occasionally a quick double-blink
    const delay = 2500 + Math.random() * 3000;
    setTimeout(() => {
      doBlink();
      if (Math.random() < 0.25){                  // 25 % chance of double-blink
        setTimeout(doBlink, 320);
      }
    }, delay);
  }

  // First blink after 1.8 s (face just appeared)
  setTimeout(() => { doBlink(); }, 1800);
})();

function updateClock(){
  const d = new Date();
  const hours = d.getHours();
  // 12-hour with a meridiem, no leading zero on the hour: 2:30 PM.
  // Midnight and noon are the cases that break naive %12 arithmetic — 0 has
  // to read as 12, which is what the || 12 is doing.
  const h = hours % 12 || 12;
  const m = String(d.getMinutes()).padStart(2, '0');
  const meridiem = hours < 12 ? 'AM' : 'PM';
  document.getElementById('clock').textContent = `${h}:${m} ${meridiem}`;
}

const bmoBoot = new Audio('bmo-on.wav');

/* === Music ================================================================
   When this desktop is embedded in the 3D room, the track is NOT played here.
   The host page owns it, because Web Audio can only process a media element
   from its own document — and the host needs it in a filter graph so it can
   sound like it's coming out of BMO's speaker from across the room, then open
   into clean stereo when you move in. So the mini-player just asks, and the
   host answers with the resulting state.

   Opened directly (not in an iframe) there is no host, so it falls back to
   playing the file locally and everything still works. */
const EMBEDDED = window.parent !== window;
const musicBtn = document.getElementById('musicToggle');
const musicNote = document.querySelector('.mini-player-note');

let localMusic = null;
function getLocalMusic() {
  if (!localMusic) {
    localMusic = new Audio('hotel.wav');
    localMusic.loop = true;
    localMusic.volume = 0.3;
  }
  return localMusic;
}

const ICON_PAUSE = '<svg class="pxi" width="11px" height="11px" viewBox="0 0 24 24" fill="currentColor" shape-rendering="crispEdges" aria-hidden="true"><path d="M10 20H4V4h6v16Zm8-16v16h-6V4h6Zm-4 2v12h2V6h-2ZM6 18h2V6H6v12Z"/></svg>';
const ICON_PLAY  = '<svg class="pxi" width="11px" height="11px" viewBox="0 0 24 24" fill="currentColor" shape-rendering="crispEdges" aria-hidden="true"><path d="M15 11h-2V9h2zm0 4h-2v-2h2zm-2 2h-2v-2h2zm0-8h-2V7h2zm-2-2H9V5h2zM9 21H7V3h2zm6-8h2v-2h-2zm-6 4h2v2H9z"/></svg>';

function paintMusicState(playing) {
  musicBtn.innerHTML = playing ? ICON_PAUSE : ICON_PLAY;
  musicNote.style.animationPlayState = playing ? 'running' : 'paused';
}

function requestMusic(action) {
  if (EMBEDDED) {
    window.parent.postMessage(
      { source: 'bmo-desktop', type: 'music', action },
      window.location.origin
    );
    return;   // the host replies with the real state
  }
  const audio = getLocalMusic();
  const wantPlay = action === 'play' || (action === 'toggle' && audio.paused);
  if (wantPlay) audio.play().catch(() => {});
  else audio.pause();
  paintMusicState(!audio.paused);
}

window.addEventListener('message', (event) => {
  if (event.origin !== window.location.origin) return;
  const msg = event.data;
  if (!msg || msg.source !== 'bmo-host' || msg.type !== 'music-state') return;
  paintMusicState(msg.playing);
});

window.addEventListener('load', () => {
  bmoBoot.play().catch(() => {});
  bmoBoot.addEventListener('ended', () => {
    setTimeout(() => requestMusic('play'), 200);
  }, { once: true });
});

/* === Window dragging (Windows 95 rubber band) ==========================
   The window does not move while you drag it. A stippled outline tracks the
   pointer and the window jumps to it on release — which is what makes it read
   as a period desktop rather than a modern drag. */
(function initWindowDragging(){
  const ghost = document.createElement('div');
  ghost.className = 'drag-ghost';
  document.body.appendChild(ghost);

  let dragWin = null;
  let startX = 0, startY = 0, originLeft = 0, originTop = 0;
  let ghostLeft = 0, ghostTop = 0;
  let topZ = 10;   // .window sits at 5; maximised at 99

  const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));

  function onDown(e){
    if (e.button !== 0) return;
    const win = e.target.closest && e.target.closest('.window');
    if (!win) return;

    // Any press raises the window, even one that never becomes a drag.
    win.style.zIndex = ++topZ;

    if (!e.target.closest('.titlebar')) return;         // body presses only focus
    if (e.target.closest('.titlebar-buttons')) return;  // leave the buttons alone
    if (win.classList.contains('maximized')) return;    // nothing to drag

    const r = win.getBoundingClientRect();
    dragWin = win;
    startX = e.clientX; startY = e.clientY;
    originLeft = r.left; originTop = r.top;
    ghostLeft = r.left;  ghostTop = r.top;

    ghost.style.width  = r.width + 'px';
    ghost.style.height = r.height + 'px';
    ghost.style.left   = r.left + 'px';
    ghost.style.top    = r.top + 'px';
    ghost.style.display = 'block';
    e.preventDefault();   // stop the titlebar text being selected mid-drag
  }

  function onMove(e){
    if (!dragWin) return;
    const w = ghost.offsetWidth;
    // You can shove a window most of the way off screen, but never so far
    // that there's no titlebar left to grab it back by.
    ghostLeft = clamp(originLeft + (e.clientX - startX), 28 - w, window.innerWidth - 28);
    ghostTop  = clamp(originTop  + (e.clientY - startY), 0, window.innerHeight - 44);
    ghost.style.left = ghostLeft + 'px';
    ghost.style.top  = ghostTop + 'px';
  }

  function onUp(){
    if (!dragWin) return;
    const win = dragWin;
    dragWin = null;
    ghost.style.display = 'none';

    win.classList.add('no-anim');
    win.style.left = ghostLeft + 'px';
    win.style.top  = ghostTop + 'px';
    void win.offsetWidth;            // force the layout so removing the class
    win.classList.remove('no-anim'); // can't get merged into one style pass
  }

  document.addEventListener('pointerdown', onDown);
  window.addEventListener('pointermove', onMove);
  window.addEventListener('pointerup', onUp);
  window.addEventListener('pointercancel', onUp);
})();
