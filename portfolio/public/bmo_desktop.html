}

body {

  width: 100vw;
  height: 100vh;
  overflow: hidden;

  .icons{

  /* === Center file icon === */
  .center-icon{
    position:absolute;top:50%;left:50%;

  .center-icon:active{transform:translate(-50%,-50%) scale(0.9);}

  /* === Screen-on / eye-adjust intro =====================================
     Fires once on page load. Two effects layered:
       1. A pure-white overlay (#screenFlash) that starts opaque and fades
          out — this is the "you just got blinded by the monitor" pop.
       2. A brightness + blur filter applied to the whole body that decays
          to normal — this is your eyes refocusing and the gain settling.
     ==================================================================== */
  #screenFlash{
    position:fixed; inset:0;
    background:#ffffff;
    z-index:99999;
    pointer-events:none;
    opacity:1;
    will-change:opacity, filter;
    /* Soft inner glow so the edges of the flash feel volumetric, not flat */
    box-shadow: inset 0 0 240px 80px #ffffff;
    animation: screenFlashFade 1.6s cubic-bezier(.2,.7,.2,1) forwards;
  }
  @keyframes screenFlashFade{
    0%   { opacity:1;    background:#ffffff; }
    8%   { opacity:0.98; background:#f4ffff; }     /* slight cool tint as it cools off */
    25%  { opacity:0.7;  background:#e6fff0; }
    55%  { opacity:0.28; background:#d8ffe0; }
    85%  { opacity:0.06; background:#d1ffd3; }
    100% { opacity:0;    background:#d1ffd3; }
  }


  /* Respect users who prefer reduced motion — skip the intro entirely. */
  @media (prefers-reduced-motion: reduce){
    #screenFlash{ animation:none; opacity:0; }
  }
</style>

// ── Screen-on flash cleanup + face reveal ────────────────────────────────────
(function setupFace(){
  const flash = document.getElementById('screenFlash');
  const frame = document.getElementById('bmoFaceFrame');

  if (flash) {
    flash.addEventListener('animationend', () => flash.remove(), { once: true });
    setTimeout(() => flash.remove(), 2200);
  }

})();

// ── BMO eye tracking + blinking ───────────────────────────────────────────────
(function initFace(){
  const leftGroup  = document.getElementById('leftEyeGroup');
  const rightGroup = document.getElementById('rightEyeGroup');
  const smileGroup = document.getElementById('smileGroup');
  const leftEl     = document.getElementById('leftEllipse');
  const rightEl    = document.getElementById('rightEllipse');

  // SVG logical eye centres (matching the viewBox)
  const LEFT_CX  = 160, LEFT_CY  = 235;
  const RIGHT_CX = 640, RIGHT_CY = 235;
  const NORMAL_RY = 30;

  // Smooth-follow state
  let targetDx = 0, targetDy = 0;
  let curDx    = 0, curDy    = 0;

  // Blink state
  let blinking = false;

  // ── Mouse tracking ──────────────────────────────────────────────────────────
  document.addEventListener('mousemove', function(e){
    const cx = window.innerWidth  / 2;
    const cy = window.innerHeight / 2;
    const nx = (e.clientX - cx) / cx;   // -1 … 1
    const ny = (e.clientY - cy) / cy;
    // Subtle: max ±16 px horizontal, ±11 px vertical
    targetDx = nx * 16;
    targetDy = ny * 11;
  });

  // ── Animation loop (smooth lerp) ────────────────────────────────────────────
  function tick(){
    curDx += (targetDx - curDx) * 0.07;
    curDy += (targetDy - curDy) * 0.07;

    // Apply translate to each eye group so blinking (ry change) stays centred
    leftGroup.setAttribute('transform',
      `translate(${LEFT_CX + curDx}, ${LEFT_CY + curDy})`);
    rightGroup.setAttribute('transform',
      `translate(${RIGHT_CX + curDx}, ${RIGHT_CY + curDy})`);

    // Smile follows at half the displacement for a subtler effect
    smileGroup.setAttribute('transform',
      `translate(${curDx * 0.5}, ${curDy * 0.5})`);

    // Pivot the ellipse around its own centre (group already positions it)
    leftEl.setAttribute('cx',  0); leftEl.setAttribute('cy',  0);
    rightEl.setAttribute('cx', 0); rightEl.setAttribute('cy', 0);

    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);

  // ── Blinking ────────────────────────────────────────────────────────────────
  function animateRy(fromRy, toRy, durationMs, onDone){
    const start = performance.now();
    function step(now){
      const t = Math.min((now - start) / durationMs, 1);
      const ry = fromRy + (toRy - fromRy) * t;
      leftEl.setAttribute('ry',  ry);
      rightEl.setAttribute('ry', ry);
      if (t < 1) requestAnimationFrame(step);
      else if (onDone) onDone();
    }
    requestAnimationFrame(step);
  }

  function doBlink(){
    if (blinking) return;
    blinking = true;

    animateRy(NORMAL_RY, 3, 75, () => {          // close
      setTimeout(() => {
        animateRy(3, NORMAL_RY, 110, () => {      // open
          blinking = false;
          scheduleNextBlink();
        });
      }, 55);                                      // hold closed
    });
  }

  function scheduleNextBlink(){
    // Blink every 2.5 – 5.5 s; occasionally a quick double-blink
    const delay = 2500 + Math.random() * 3000;
    setTimeout(() => {
      doBlink();
      if (Math.random() < 0.25){                  // 25 % chance of double-blink
        setTimeout(doBlink, 320);
      }
    }, delay);
  }

  // First blink after 1.8 s (face just appeared)
  setTimeout(() => { doBlink(); }, 1800);
})();

// Portfolio click handler
let portfolioOpened=false;
let browserEverOpened=false;
document.getElementById('portfolioIcon').addEventListener('click',function(){
  if(portfolioOpened) return;
  portfolioOpened=true;

  // If the browser was already opened once, just show it again — no need to
  // replay the npm terminal animation or append duplicate lines.
  if(browserEverOpened){
    openBrowser();
    return;
  }
  browserEverOpened=true;

  // Remove cursor
  const cur=document.getElementById('termCursor');
  if(cur) cur.remove();

  // Type npm lines in terminal
  let ni=0;
  function typeNpmLine(){
    if(ni>=npmLines.length){
      const c=document.createElement('div');
      c.innerHTML='<span class="t-green">> <span class="cursor-blink">_</span></span>';
      term.appendChild(c);
      // Scroll terminal to bottom
      term.parentElement.scrollTop=term.parentElement.scrollHeight;
      return;
    }
    const div=document.createElement('div');
    div.className=npmLines[ni][1];
    div.textContent=npmLines[ni][0];
    div.style.opacity='0';term.appendChild(div);
    requestAnimationFrame(()=>{div.style.opacity='1';});
    // Scroll terminal
    term.parentElement.scrollTop=term.parentElement.scrollHeight;
    ni++;


    if(ni===npmLines.length){
      setTimeout(typeNpmLine,80);
      setTimeout(openBrowser,600);
    } else {
      setTimeout(typeNpmLine,70+Math.random()*60);
    }
  }

  // Small delay then start typing
  setTimeout(typeNpmLine,200);
});

function openBrowser(){
  const bw=document.getElementById('browserWindow');
  bw.classList.remove('win-hidden');
  document.getElementById('taskBrowser').classList.remove('task-hidden');
  document.getElementById('browserLoading').style.display='flex';
  document.getElementById('browserIframe').style.display='none';

  // Let the browser paint the small window for one frame, then animate to maximized
  requestAnimationFrame(()=>{
    requestAnimationFrame(()=>{ bw.classList.add('maximized'); });
  });

  setTimeout(()=>{
    document.getElementById('browserLoading').style.display='none';
    const iframe=document.getElementById('browserIframe');
    iframe.src='/2d-website/';
    iframe.style.display='block';
    iframe.onload=()=>iframe.contentWindow.focus();
  },1200);



}

    document.getElementById('terminalWindow').classList.add('win-hidden');
    document.getElementById('taskTerminal').classList.add('task-hidden');

function toggleWindow(name){
  if(name==='terminal'){
    document.getElementById('terminalWindow').classList.toggle('win-hidden');
  } else if(name==='browser'){
    document.getElementById('browserWindow').classList.toggle('win-hidden');
  }
}
